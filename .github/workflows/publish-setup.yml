# Publishes the setup image to ghcr so nothing is ever built on the NAS.
#
# This is what makes the compose in docs/deploy.md copy-pasteable: Portainer's
# stack editor and Synology's Container Manager can pull an image, but they
# cannot build one from a directory that is not there.

name: publish setup image

on:
  push:
    branches: [main]
    paths:
      - 'setup/**'
      - '.github/workflows/publish-setup.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./setup
          # arm64 matters here: a lot of NAS boxes are ARM, and an amd64-only
          # image fails at pull time with an error most users cannot read.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-starter-setup:latest
            ghcr.io/${{ github.repository_owner }}/hermes-starter-setup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
